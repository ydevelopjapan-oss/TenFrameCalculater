<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さくらの計算機</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 20px 12px;
  background: #fff7fb;
  color: #654b59;
  font-family: sans-serif;
  text-align: center;
}
h1 { color: #d878a0; font-size: 25px; }
.problem { font-size: 38px; font-weight: bold; margin: 20px; }
.flower { width: 100%; max-width: 100px; }
.name { font-weight: bold; }
.count { font-size: 13px; color: #b18b9e; }
svg { width: 100%; overflow: visible; }
.petal { fill: #f5a5c2; stroke: #dc7a9f; stroke-width: 1.5; }
.center { fill: #ffe08a; }
.controls { margin: 22px auto; }
input {
  width: 110px; height: 52px;
  border: 2px solid #efbfd2;
  border-radius: 14px;
  font-size: 25px; text-align: center;
}
button {
  border: 0; border-radius: 12px;
  background: #df86a9; color: white;
  font-size: 19px; font-weight: bold;
  padding: 12px 22px;
}
button:active { transform: scale(.96); }
.keys {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 8px; max-width: 260px; margin: 15px auto;
}
.keys button {
  background: white; color: #765466;
  border: 1px solid #efd3df;
}
#status { min-height: 45px; margin: 18px; }
#result {
  display: none; padding: 15px;
  background: #eff9ed; border-radius: 18px;
  max-width: 300px; margin: auto;
}
#tree {
  font-size: 90px;
  animation: appear .8s cubic-bezier(.2,1.5,.5,1);
}
@keyframes appear {
  from { transform: scale(.2); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.garden {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  align-items: stretch;
}

.bed {
  position: relative;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: center;
  gap: 4px;
  padding: 8px 4px;
  background: #fff0f5;
  border-radius: 18px;
}

.flower {
  width: 100%;
  min-width: 0;
  max-width: 100px;
  aspect-ratio: 1;
}

.flower svg {
  display: block;
  width: 100%;
  height: 100%;
}

#tree {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 2;
}
#tree svg {
  width: 100%;
  max-width: 110px;
}
</style>
</head>
<body>

<h1>🌸 さくらの計算機 🌸</h1>

<div class="problem">4 ＋ 9</div>

<div class="garden">

  <!-- 左の花壇：B・A -->
  <div class="bed bed-left">
    <div class="flower">
      <svg id="B" viewBox="0 0 100 100"></svg>
    </div>

    <div class="flower">
      <svg id="A" viewBox="0 0 100 100"></svg>
    </div>

    <div id="tree"></div>
  </div>

  <!-- 右の花壇：D・C -->
  <div class="bed bed-right">
    <div class="flower">
      <svg id="D" viewBox="0 0 100 100"></svg>
    </div>

    <div class="flower">
      <svg id="C" viewBox="0 0 100 100"></svg>
    </div>
  </div>

</div>

<div class="controls">
  <input id="answer" inputmode="numeric" placeholder="答え">
  <button id="equal">＝</button>
</div>

<div class="keys">
  <button onclick="key('1')">1</button>
  <button onclick="key('2')">2</button>
  <button onclick="key('3')">3</button>
  <button onclick="key('4')">4</button>
  <button onclick="key('5')">5</button>
  <button onclick="key('6')">6</button>
  <button onclick="key('7')">7</button>
  <button onclick="key('8')">8</button>
  <button onclick="key('9')">9</button>
  <button onclick="clearAnswer()">消</button>
  <button onclick="key('0')">0</button>
  <button onclick="backspace()">⌫</button>
</div>

<div id="status">答えを考えてみよう！</div>

<div id="result">
  <h2>4 ＋ 9 ＝ 13</h2>
  <p>2つの花が完成したよ！</p>
</div>

<script>
const angles = [72,144,216,288,0];

let flowers = {
  A:[1,2,3,4],
  B:[],
  C:[1,2,3,4,5],
  D:[1,2,3,4]
};

let finished = false;

function point(n) {
  const rad = angles[n-1] * Math.PI / 180;
  return [
    50 + Math.sin(rad)*23,
    50 - Math.cos(rad)*23
  ];
}

function draw(name) {
  const svg = document.getElementById(name);
  svg.innerHTML = '';

  flowers[name].forEach(n => {
    const [x,y] = point(n);
    const p = document.createElementNS(
      'http://www.w3.org/2000/svg','ellipse'
    );
    p.setAttribute('cx',x);
    p.setAttribute('cy',y);
    p.setAttribute('rx',8);
    p.setAttribute('ry',14);
    p.setAttribute('transform',
      `rotate(${angles[n-1]} ${x} ${y})`);
    p.setAttribute('class','petal');
    p.setAttribute('data-petal', n);
    svg.appendChild(p);
  });

  if(flowers[name].length === 5) {
    const c = document.createElementNS(
      'http://www.w3.org/2000/svg','circle'
    );
    c.setAttribute('cx',50);
    c.setAttribute('cy',50);
    c.setAttribute('r',7);
    c.setAttribute('class','center');
    svg.appendChild(c);
  }
}

function render() {
  ['A','B','C','D'].forEach(draw);
}
render();

function key(n) {
  if(finished) return;
  const input = document.getElementById('answer');
  input.value = (input.value+n).slice(0,2);
}
function clearAnswer() {
  document.getElementById('answer').value='';
}
function backspace() {
  const input = document.getElementById('answer');
  input.value=input.value.slice(0,-1);
}

document.getElementById('equal').onclick = function() {
  if(finished) return;

  const answer = document.getElementById('answer').value;
  const status = document.getElementById('status');

  if(answer !== '') {
    if(Number(answer) === 13) {
      finished = true;
      status.textContent='正解！すごい！';
      showResult49();
    } else {
      status.textContent='もう一度考えてみよう！';
    }
    return;
  }

  status.textContent='花びらが集まるよ…';
  this.disabled=true;

  setTimeout(animation,2000);
};

// 5＋6用：花全体を移動する関数
function animation56() {
  const moving = document.getElementById('C');
  const target = document.getElementById('B');

  const from = moving.getBoundingClientRect();
  const to = target.getBoundingClientRect();

  const dx = to.left - from.left;
  const dy = to.top - from.top;

  const move = moving.animate([
    { transform: 'translate(0px, 0px)' },
    { transform: `translate(${dx}px, ${dy}px)` }
  ], {
    duration: 1100,
    easing: 'ease-in-out',
    fill: 'forwards'
  });

  move.onfinish = function() {
    completeTransfer56();
  };
}

function completeTransfer56() {
  flowers.B = [1,2,3,4,5];
  flowers.C = [];

  render();
  showResult();
}


// 4＋9用：花びら1枚を移動する関数
function animation() {
  const sourceSvg = document.getElementById('A');
  const targetSvg = document.getElementById('D');

  // Aの288°の花びら（番号4）
  const sourcePetal =
    sourceSvg.querySelector('[data-petal="4"]');

  if (!sourcePetal) {
    completeTransfer49();
    return;
  }

  // 移動元の画面上の位置
  const rect = sourcePetal.getBoundingClientRect();

  // Dの0°（番号5）の位置
  const targetPoint = targetSvg.createSVGPoint();
  targetPoint.x = 50;
  targetPoint.y = 27;

  const destination =
    targetPoint.matrixTransform(targetSvg.getScreenCTM());

  const scale =
    targetSvg.getBoundingClientRect().width / 100;

  const w = 17 * scale;
  const h = 29 * scale;

  const startX = rect.left + rect.width / 2 - w / 2;
  const startY = rect.top + rect.height / 2 - h / 2;

  const endX = destination.x - w / 2;
  const endY = destination.y - h / 2;

  // 移動する花びらの複製を作る
  const flying = document.createElement('div');

  flying.style.position = 'fixed';
  flying.style.left = `${startX}px`;
  flying.style.top = `${startY}px`;
  flying.style.width = `${w}px`;
  flying.style.height = `${h}px`;
  flying.style.borderRadius = '50%';
  flying.style.background = '#f5a5c2';
  flying.style.border = '1.5px solid #dc7a9f';
  flying.style.transform = 'rotate(288deg)';
  flying.style.transformOrigin = 'center';
  flying.style.pointerEvents = 'none';
  flying.style.zIndex = '9999';

  document.body.appendChild(flying);

  // 元の花びらは一時的に隠す
  sourcePetal.style.opacity = '0';

  const move = flying.animate([
    {
      left: `${startX}px`,
      top: `${startY}px`,
      transform: 'rotate(288deg)'
    },
    {
      left: `${endX}px`,
      top: `${endY}px`,
      transform: 'rotate(360deg)'
    }
  ], {
    duration: 1000,
    easing: 'ease-in-out',
    fill: 'forwards'
  });

  move.onfinish = function() {
    flying.remove();
    completeTransfer49();
  };
}


// 4＋9の移動完了後の状態
function completeTransfer49() {
  flowers.A = flowers.A.filter(n => n !== 4);
  flowers.D = [...flowers.D, 5];

  render();
  showResult();
}
function showResult() {
  const tree = document.getElementById('tree');

  // 木のイラストを挿入
  tree.innerHTML = `
    <svg viewBox="0 0 160 160">

      <!-- 幹 -->
      <path d="M75 145 Q68 105 78 65"
        stroke="#936b4d"
        stroke-width="16"
        fill="none"
        stroke-linecap="round"/>

      <!-- 腕・枝 -->
      <path d="M75 105 L35 72 M76 95 L120 65"
        stroke="#936b4d"
        stroke-width="9"
        fill="none"
        stroke-linecap="round"/>

      <!-- 頭の枝 -->
      <path d="M78 82 L78 48"
        stroke="#936b4d"
        stroke-width="7"
        fill="none"
        stroke-linecap="round"/>

      <!-- ギョロ目 -->
      <g>
        <path d="M78 49 Q65 35 55 47
          M78 49 Q92 35 103 47"
          stroke="#936b4d"
          stroke-width="5"
          fill="none"/>

        <ellipse cx="55" cy="45"
          rx="12" ry="15"
          fill="white"
          stroke="#594653"
          stroke-width="2"/>

        <ellipse cx="103" cy="45"
          rx="12" ry="15"
          fill="white"
          stroke="#594653"
          stroke-width="2"/>

        <circle cx="59" cy="49" r="5" fill="black"/>
        <circle cx="99" cy="49" r="5" fill="black"/>
      </g>

      <!-- 口 -->
      <path d="M68 115 Q78 125 88 115"
        stroke="#594653"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"/>

    </svg>
  `;

  // 木が中央にポンッと誕生
  const svg = tree.querySelector('svg');

  svg.animate([
    { transform: 'scale(0.1)', opacity: 0 },
    { transform: 'scale(1.15)', opacity: 1 },
    { transform: 'scale(1)', opacity: 1 }
  ], {
    duration: 800,
    easing: 'cubic-bezier(.2,1.5,.5,1)',
    fill: 'forwards'
  });

  document.getElementById('result').style.display = 'block';
  document.getElementById('equal').disabled = true;
}

</script>
</body>
</html>
