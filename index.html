<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さくらの計算機</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 20px 12px;
  background: #fff7fb;
  color: #654b59;
  font-family: sans-serif;
  text-align: center;
}
h1 { color: #d878a0; font-size: 25px; }
.problem { font-size: 38px; font-weight: bold; margin: 20px; }
.flower { width: 100%; max-width: 100px; }
.name { font-weight: bold; }
.count { font-size: 13px; color: #b18b9e; }
svg { width: 100%; overflow: visible; }
.petal { fill: #f5a5c2; stroke: #dc7a9f; stroke-width: 1.5; }
.center { fill: #ffe08a; }
.controls { margin: 22px auto; }
input {
  width: 110px; height: 52px;
  border: 2px solid #efbfd2;
  border-radius: 14px;
  font-size: 25px; text-align: center;
}
button {
  border: 0; border-radius: 12px;
  background: #df86a9; color: white;
  font-size: 19px; font-weight: bold;
  padding: 12px 22px;
}
button:active { transform: scale(.96); }
.keys {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 8px; max-width: 260px; margin: 15px auto;
}
.keys button {
  background: white; color: #765466;
  border: 1px solid #efd3df;
}
#status { min-height: 45px; margin: 18px; }
#result {
  display: none; padding: 15px;
  background: #eff9ed; border-radius: 18px;
  max-width: 300px; margin: auto;
}
#tree {
  font-size: 90px;
  animation: appear .8s cubic-bezier(.2,1.5,.5,1);
}
@keyframes appear {
  from { transform: scale(.2); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.garden {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  align-items: stretch;
}

.bed {
  position: relative;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: center;
  gap: 4px;
  padding: 8px 4px;
  background: #fff0f5;
  border-radius: 18px;
}

.flower {
  width: 100%;
  min-width: 0;
  max-width: 100px;
  aspect-ratio: 1;
}

.flower svg {
  display: block;
  width: 100%;
  height: 100%;
}

#tree {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 2;
}
#tree svg {
  width: 100%;
  max-width: 110px;
}
#setup {
  margin: 30px auto;
}

#setup input {
  width: 90px;
  margin: 8px;
}

#setup button {
  display: block;
  margin: 20px auto;
}
</style>
</head>
<body>

<h1>🌸 さくらの計算機 🌸</h1>
<div id="setup">
  <p>好きな数を入力してね</p>

  <div>
    <input id="leftNumber" type="number"
      min="0" max="9" value="4">
    ＋
    <input id="rightNumber" type="number"
      min="0" max="9" value="9">
  </div>

  <button onclick="startGame()">計算スタート</button>
</div>
<div id="game" style="display:none">
<div class="problem" id="problem"></div>

<div class="garden">

  <!-- 左の花壇：B・A -->
  <div class="bed bed-left">
    <div class="flower">
      <svg id="B" viewBox="0 0 100 100"></svg>
    </div>

    <div class="flower">
      <svg id="A" viewBox="0 0 100 100"></svg>
    </div>

    <div id="tree"></div>
  </div>

  <!-- 右の花壇：D・C -->
  <div class="bed bed-right">
    <div class="flower">
      <svg id="D" viewBox="0 0 100 100"></svg>
    </div>

    <div class="flower">
      <svg id="C" viewBox="0 0 100 100"></svg>
    </div>
  </div>

</div>

<div class="controls">
  <input id="answer" inputmode="numeric" placeholder="答え">
  <button id="equal">＝</button>
</div>

<div class="keys">
  <button onclick="key('1')">1</button>
  <button onclick="key('2')">2</button>
  <button onclick="key('3')">3</button>
  <button onclick="key('4')">4</button>
  <button onclick="key('5')">5</button>
  <button onclick="key('6')">6</button>
  <button onclick="key('7')">7</button>
  <button onclick="key('8')">8</button>
  <button onclick="key('9')">9</button>
  <button onclick="clearAnswer()">消</button>
  <button onclick="key('0')">0</button>
  <button onclick="backspace()">⌫</button>
</div>

<div id="status">答えを考えてみよう！</div>

<div id="result">
  <h2 id="resultText"></h2>
  <p>2つの花が完成したよ！</p>
</div>
</div>

<script>
const angles = [72,144,216,288,0];


// 計算問題
let problem = {
  left: 4,
  right: 9
};

let answerNumber = problem.left + problem.right;

// 数字に応じて花びらを配置する
function createFlowers(number, leftName, rightName) {
  const flowers = {
    [leftName]: [],
    [rightName]: []
  };

  // 右側の花から最大5枚配置
  const rightCount = Math.min(number, 5);
  flowers[rightName] =
    Array.from({ length: rightCount }, (_, i) => i + 1);

  // 残りを左側の花に配置
  const leftCount = number - rightCount;
  flowers[leftName] =
    Array.from({ length: leftCount }, (_, i) => i + 1);

  return flowers;
}
function startGame() {
  const left = Number(
    document.getElementById('leftNumber').value
  );

  const right = Number(
    document.getElementById('rightNumber').value
  );

  if (
    !Number.isInteger(left) ||
    !Number.isInteger(right) ||
    left < 0 || left > 9 ||
    right < 0 || right > 9
  ) {
    alert('0〜9の数を入力してね');
    return;
  }

  problem = { left, right };
  answerNumber = left + right;

  flowers = {
    ...createFlowers(problem.left, 'B', 'A'),
    ...createFlowers(problem.right, 'D', 'C')
  };

  finished = false;
  pendingTransfer = null;
  underTenDestination = null;

  document.getElementById('answer').value = '';
  document.getElementById('result').style.display = 'none';
  document.getElementById('tree').innerHTML = '';
  document.getElementById('equal').disabled = false;

  document.getElementById('problem').textContent =
    `${problem.left} ＋ ${problem.right}`;

  document.getElementById('status').textContent =
    '答えを考えてみよう！';

  render();

  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'block';
}
// 左右それぞれの花壇を作る
let flowers = {
  ...createFlowers(problem.left, 'B', 'A'),
  ...createFlowers(problem.right, 'D', 'C')
};


let finished = false;

function point(n) {
  const rad = angles[n-1] * Math.PI / 180;
  return [
    50 + Math.sin(rad)*23,
    50 - Math.cos(rad)*23
  ];
}

function draw(name) {
  const svg = document.getElementById(name);
  svg.innerHTML = '';

  flowers[name].forEach(n => {
    const [x,y] = point(n);
    const p = document.createElementNS(
      'http://www.w3.org/2000/svg','ellipse'
    );
    p.setAttribute('cx',x);
    p.setAttribute('cy',y);
    p.setAttribute('rx',8);
    p.setAttribute('ry',14);
    p.setAttribute('transform',
      `rotate(${angles[n-1]} ${x} ${y})`);
    p.setAttribute('class','petal');
    p.setAttribute('data-petal', n);
    svg.appendChild(p);
  });

  if(flowers[name].length === 5) {
    const c = document.createElementNS(
      'http://www.w3.org/2000/svg','circle'
    );
    c.setAttribute('cx',50);
    c.setAttribute('cy',50);
    c.setAttribute('r',7);
    c.setAttribute('class','center');
    svg.appendChild(c);
  }
}

function render() {
  ['A','B','C','D'].forEach(draw);
}
render();
document.getElementById('problem').textContent =
  `${problem.left} ＋ ${problem.right}`;


// 左右の花壇の花びらの合計を調べる
function getGardenCounts() {
  return {
    left: flowers.A.length + flowers.B.length,
    right: flowers.C.length + flowers.D.length
  };
}

// 成立する移動パターンを調べる
function getTransferCandidates() {
  const { left, right } = getGardenCounts();
  const candidates = [];

  // ① 右から左へ移動して、左を10にする
  const moveToLeft10 = 10 - left;
  if (moveToLeft10 > 0 && moveToLeft10 <= right) {
    candidates.push({
      pattern: 1,
      from: 'right',
      to: 'left',
      target: 10,
      moveCount: moveToLeft10
    });
  }

  // ② 右から左へ移動して、左を5にする
  const moveToLeft5 = 5 - left;
  if (moveToLeft5 > 0 && moveToLeft5 <= right) {
    candidates.push({
      pattern: 2,
      from: 'right',
      to: 'left',
      target: 5,
      moveCount: moveToLeft5
    });
  }

  // ③ 左から右へ移動して、右を10にする
  const moveToRight10 = 10 - right;
  if (moveToRight10 > 0 && moveToRight10 <= left) {
    candidates.push({
      pattern: 3,
      from: 'left',
      to: 'right',
      target: 10,
      moveCount: moveToRight10
    });
  }

  // ④ 左から右へ移動して、右を5にする
  const moveToRight5 = 5 - right;
  if (moveToRight5 > 0 && moveToRight5 <= left) {
    candidates.push({
      pattern: 4,
      from: 'left',
      to: 'right',
      target: 5,
      moveCount: moveToRight5
    });
  }

  return candidates;
}



// 成立するパターンから移動方法を選ぶ
function chooseTransferPlan() {
  const { left, right } = getGardenCounts();

  // 左右それぞれの完成した花の数
  const leftCompleted = ['B', 'A'].filter(
    name => flowers[name].length === 5
  ).length;

  const rightCompleted = ['D', 'C'].filter(
    name => flowers[name].length === 5
  ).length;

  // 左右に完成した花が1つずつあり、
  // 左側が5枚なら、右の完成した花を左へ移す
  if (
    leftCompleted === 1 &&
    rightCompleted === 1 &&
    left === 5 &&
    right >= 5
  ) {
    return {
      pattern: 1,
      from: 'right',
      to: 'left',
      target: 10,
      moveCount: 5
    };
  }

  // 通常は成立するパターンからランダムに選ぶ
  const candidates = getTransferCandidates();

  if (candidates.length === 0) {
    return null;
  }

  const index = Math.floor(Math.random() * candidates.length);
  return candidates[index];
}

function createTransferSelection(plan) {
  if (!plan) return null;

  // 移動元の花の順番（画面の左から右）
  const sourceNames =
    plan.from === 'right' ? ['D', 'C'] : ['B', 'A'];

  let remaining = plan.moveCount;

  // 丸ごと移動する花
  const wholeFlowers = [];

  // 花びらだけ移動する場合の一覧
  const petals = {};

  // 指定した花から、番号の大きい順に花びらを選ぶ
  function takePetals(name, count) {
    const selected = flowers[name].slice(-count);

    if (selected.length > 0) {
      petals[name] = selected;
      remaining -= selected.length;
    }
  }

  // 5枚以上なら、完成した花を優先して丸ごと移動
  if (plan.moveCount >= 5) {
    for (const name of sourceNames) {
      if (remaining >= 5 && flowers[name].length === 5) {
        wholeFlowers.push(name);
        remaining -= 5;
      }
    }
  }

  // まず不完全な花から花びらを取る
  for (const name of sourceNames) {
    if (remaining <= 0) break;

    if (
      flowers[name].length > 0 &&
      flowers[name].length < 5 &&
      !wholeFlowers.includes(name)
    ) {
      takePetals(
        name,
        Math.min(remaining, flowers[name].length)
      );
    }
  }

  // 足りなければ完成した花も分解する
  for (const name of sourceNames) {
    if (remaining <= 0) break;

    if (
      flowers[name].length === 5 &&
      !wholeFlowers.includes(name)
    ) {
      takePetals(name, Math.min(remaining, 5));
    }
  }

  return {
    ...plan,
    wholeFlowers,
    petals
  };
}


function buildTransferResult(selection) {
  if (!selection) return null;

  // 現在の花壇をコピー
  const nextFlowers = {
    A: [...flowers.A],
    B: [...flowers.B],
    C: [...flowers.C],
    D: [...flowers.D]
  };

  const sourceNames =
    selection.from === 'right' ? ['D', 'C'] : ['B', 'A'];

  const targetNames =
    selection.to === 'left' ? ['B', 'A'] : ['D', 'C'];

  const moves = [];

  // 移動先に空きがない場合、既存の花びらを整理する
  function makeEmptySlot() {
    const empty = targetNames.find(
      name => nextFlowers[name].length === 0
    );

    if (empty) return empty;

    // 移動先にある花びらをすべて集める
    const existing = targetNames.flatMap(name =>
      nextFlowers[name].map(petal => ({
        from: name,
        petal
      }))
    );

    // 5枚を超える場合は、1つの花にまとめられない
    if (existing.length > 5) return null;

    // 先頭の花にまとめて、もう一方を空ける
    const destination = targetNames[0];

    targetNames.forEach(name => {
      nextFlowers[name] = [];
    });

    existing.forEach((item, index) => {
      const targetPetal = index + 1;

      nextFlowers[destination].push(targetPetal);

      // 実際に位置や番号が変わる花びらだけ動かす
      if (
        item.from !== destination ||
        item.petal !== targetPetal
      ) {
        moves.push({
          type: 'petal',
          from: item.from,
          petal: item.petal,
          to: destination,
          targetPetal
        });
      }
    });

    return targetNames[1];
  }

  // 完成した花を丸ごと移動
  for (const name of selection.wholeFlowers) {
    const destination = makeEmptySlot();

    if (!destination) return null;

    nextFlowers[destination] = [...nextFlowers[name]];
    nextFlowers[name] = [];

    moves.push({
      type: 'whole',
      from: name,
      to: destination
    });
  }

  // 花びらだけを移動
  for (const name of sourceNames) {
    const selected = selection.petals[name] || [];

    for (const petal of selected) {
      // 5枚未満の花を優先
      let destination = targetNames.find(
        target =>
          nextFlowers[target].length > 0 &&
          nextFlowers[target].length < 5
      );

      // なければ空の花を使う
      if (!destination) {
        destination = targetNames.find(
          target => nextFlowers[target].length === 0
        );
      }

      if (!destination) return null;

      const used = nextFlowers[destination];

      const targetPetal = [1, 2, 3, 4, 5].find(
        n => !used.includes(n)
      );

      if (!targetPetal) return null;

      nextFlowers[destination].push(targetPetal);

      nextFlowers[name] =
        nextFlowers[name].filter(n => n !== petal);

      moves.push({
        type: 'petal',
        from: name,
        petal,
        to: destination,
        targetPetal
      });
    }
  }

  // 移動枚数が計画どおりか確認
  const movedCount =
    selection.wholeFlowers.length * 5 +
    Object.values(selection.petals)
      .reduce((sum, petals) => sum + petals.length, 0);

  if (movedCount !== selection.moveCount) {
    return null;
  }

  return {
    nextFlowers,
    moves
  };
}



let pendingTransfer = null;
// 10未満のとき、最終的に花びらを集める花壇
let underTenDestination = null;
// 10未満の移動計画
function chooseUnderTenPlan() {
  const counts = getGardenCounts();

  const to = underTenDestination;
  const from = to === 'left' ? 'right' : 'left';

  const targetCount = counts[to];
  const sourceCount = counts[from];

  if (sourceCount === 0) return null;

  // すでに完成した花があるか
  const hasCompletedFlower =
    ['A', 'B', 'C', 'D'].some(
      name => flowers[name].length === 5
    );

  let moveCount;

  // 両方5未満で、まだ完成した花がない場合は
  // まず5枚を作る
  if (
    answerNumber >= 5 &&
    targetCount < 5 &&
    !hasCompletedFlower
  ) {
    moveCount = 5 - targetCount;
  } else {
    // 完成した花がある場合は壊さず、
    // 残りをすべて移動する
    moveCount = sourceCount;
  }

  return {
    pattern: 0,
    from,
    to,
    target: targetCount + moveCount,
    moveCount
  };
}
function prepareRandomTransfer() {
  // ① 移動パターンを選ぶ
if (
  answerNumber < 10 &&
  underTenDestination === null
) {
  underTenDestination =
    Math.random() < 0.5 ? 'left' : 'right';
}

const plan = answerNumber < 10
  ? chooseUnderTenPlan()
  : chooseTransferPlan();

  if (!plan) {
    document.getElementById('status').textContent =
      '移動できるパターンがありません。';
    return null;
  }

  // ② 移動する花・花びらを選ぶ
  const selection = createTransferSelection(plan);

  // ③ 移動後の配置を計算する
  const result = buildTransferResult(selection);

  if (!result) {
    document.getElementById('status').textContent =
      '移動後の配置を作れませんでした。';
    return null;
  }

  pendingTransfer = {
    plan,
    selection,
    result
  };

  const patternNames = {
    1: '右から左へ10を作る',
    2: '右から左へ5を作る',
    3: '左から右へ10を作る',
    4: '左から右へ5を作る'
  };

  document.getElementById('status').textContent =
    `パターン${plan.pattern}：${patternNames[plan.pattern]}（${plan.moveCount}枚移動）`;

  return pendingTransfer;
}

// 花びら・花を実際に移動させる
function animateElement(element, from, to, duration = 900) {
  return new Promise(resolve => {
    const animation = element.animate([
      {
        left: `${from.left}px`,
        top: `${from.top}px`
      },
      {
        left: `${to.left}px`,
        top: `${to.top}px`
      }
    ], {
      duration,
      easing: 'ease-in-out',
      fill: 'forwards'
    });

    animation.onfinish = resolve;
  });
}


// 花全体を移動する
async function animateWholeFlower(move) {
  const source = document.getElementById(move.from);
  const target = document.getElementById(move.to);

  const from = source.getBoundingClientRect();
  const to = target.getBoundingClientRect();

  const flying = source.cloneNode(true);

  flying.style.position = 'fixed';
  flying.style.left = `${from.left}px`;
  flying.style.top = `${from.top}px`;
  flying.style.width = `${from.width}px`;
  flying.style.height = `${from.height}px`;
  flying.style.margin = '0';
  flying.style.zIndex = '9999';
  flying.style.pointerEvents = 'none';

  document.body.appendChild(flying);

  // 元の花は隠したままにする
  source.style.visibility = 'hidden';

  await animateElement(flying, from, to, 1100);

  // 移動先に残しておく
  return flying;
}
// 花びら1枚を移動する
async function animatePetal(move) {
  const sourceSvg = document.getElementById(move.from);
  const targetSvg = document.getElementById(move.to);

  const sourcePetal = sourceSvg.querySelector(
    `[data-petal="${move.petal}"]`
  );

  if (!sourcePetal) return null;

  const rect = sourcePetal.getBoundingClientRect();

  const scale = targetSvg.getBoundingClientRect().width / 100;

  const width = 16 * scale;
  const height = 28 * scale;

  const targetPoint = targetSvg.createSVGPoint();
  const [x, y] = point(move.targetPetal);
  targetPoint.x = x;
  targetPoint.y = y;

  const destination = targetPoint.matrixTransform(
    targetSvg.getScreenCTM()
  );

  const from = {
    left: rect.left + rect.width / 2 - width / 2,
    top: rect.top + rect.height / 2 - height / 2
  };

  const to = {
    left: destination.x - width / 2,
    top: destination.y - height / 2
  };

  const flying = document.createElement('div');

  flying.style.position = 'fixed';
  flying.style.left = `${from.left}px`;
  flying.style.top = `${from.top}px`;
  flying.style.width = `${width}px`;
  flying.style.height = `${height}px`;
  flying.style.borderRadius = '50%';
  flying.style.background = '#f5a5c2';
  flying.style.border = '1.5px solid #dc7a9f';
  flying.style.transform =
    `rotate(${angles[move.petal - 1]}deg)`;
  flying.style.zIndex = '9999';
  flying.style.pointerEvents = 'none';

  document.body.appendChild(flying);

  // 元の花びらは隠したままにする
  sourcePetal.style.visibility = 'hidden';

  await animateElement(flying, from, to);

  // 移動先に残しておく
  return flying;
}

// 抽選結果に従って、同時に移動させる

async function animateTransfer(transfer) {
  const status = document.getElementById('status');

  document.getElementById('equal').disabled = true;
  status.textContent = '花が移動するよ…';

  // すべての移動を同時に開始
  const flyingElements = await Promise.all(
    transfer.result.moves.map(move => {
      if (move.type === 'whole') {
        return animateWholeFlower(move);
      } else {
        return animatePetal(move);
      }
    })
  );

  // 移動後の配置を確定
  flowers = transfer.result.nextFlowers;

  ['A','B','C','D'].forEach(name => {
    document.getElementById(name).style.visibility = '';
  });

  flyingElements.forEach(element => {
    if (element) element.remove();
  });

  render();

// 移動後の枚数を確認
const counts = getGardenCounts();

// 10未満の場合は、最終目的地へ集める
if (answerNumber < 10) {
  const targetCount = counts[underTenDestination];

  // まだ移動する花びらが残っている
  if (targetCount < answerNumber) {
    status.textContent = '残りの花びらも集めるよ！';

    const nextTransfer = prepareRandomTransfer();

    if (nextTransfer) {
      await animateTransfer(nextTransfer);
      return;
    }
  }

  // すべて集まった
  status.textContent = '花びらが全部集まったよ！';
  showResult();
  return;
}
  // 左側に10枚集まった場合
  if (counts.left === 10) {
    status.textContent = '左の花壇に10枚集まったよ！';
    showResult();
    return;
  }
  // 右側に10枚集まった場合場合
  if (counts.right === 10) {
    status.textContent = '花壇の中身を入れ替えるよ…';
    await moveTenToLeft();
    return;
  }
  // どちらかの花壇に5枚集まった場合
if (counts.left === 5 || counts.right === 5) {
  const side = counts.left === 5 ? '左' : '右';

  status.textContent =
    `${side}の花壇に5枚集まったよ！次の移動を考えよう！`;

  document.getElementById('equal').disabled = false;
  return;
}
  status.textContent = '移動できたよ！';
  document.getElementById('equal').disabled = false;
}


// 右側の10枚を左へ、残りの花びらを右へ移す
async function moveTenToLeft() {
  const status = document.getElementById('status');

  const leftNames = ['B', 'A'];
  const rightNames = ['D', 'C'];

  status.textContent = '花壇の中身を入れ替えるよ！';

  // 右側の完成した花を調べる
  const completedFlowers = rightNames.filter(
    name => flowers[name].length === 5
  );

  // 10枚が完成した花2つになっているか確認
  if (completedFlowers.length !== 2) {
    status.textContent = '完成した花の配置を確認できません。';
    document.getElementById('equal').disabled = false;
    return;
  }

  // 完成した花を左側へ移す
  const wholeMoves = completedFlowers.map((name, i) => ({
    type: 'whole',
    from: name,
    to: leftNames[i]
  }));

  // 左側に残っている花びらを集める
  const remainingPetals = [];

  leftNames.forEach(name => {
    flowers[name].forEach(petal => {
      remainingPetals.push({
        from: name,
        petal
      });
    });
  });

  // 残りの花びらを右側の空いた場所へ割り当てる
  const petalMoves = remainingPetals.map((item, i) => {
    const targetIndex = Math.floor(i / 5);
    const targetPetal = (i % 5) + 1;

    return {
      type: 'petal',
      from: item.from,
      petal: item.petal,
      to: rightNames[targetIndex],
      targetPetal
    };
  });

  // 花と花びらを同時に移動
  const flyingElements = await Promise.all([
    ...wholeMoves.map(move => animateWholeFlower(move)),
    ...petalMoves.map(move => animatePetal(move))
  ]);

  // 移動後の配置を作る
  const nextFlowers = {
    A: [],
    B: [],
    C: [],
    D: []
  };

  // 左側に完成した花2つ
  wholeMoves.forEach(move => {
    nextFlowers[move.to] = [1, 2, 3, 4, 5];
  });

  // 右側に残りの花びらを配置
  petalMoves.forEach(move => {
    nextFlowers[move.to].push(move.targetPetal);
  });

  // 配置を確定
  flowers = nextFlowers;

  // アニメーション用の複製を片付ける
  ['A', 'B', 'C', 'D'].forEach(name => {
    document.getElementById(name).style.visibility = '';
  });

  flyingElements.forEach(element => {
    if (element) element.remove();
  });

  render();

  status.textContent = '左の花壇に10枚集まったよ！';

  // 桜の木が誕生
  showResult();
}

document.getElementById('equal').onclick = function() {

// 5＋6用：花全体を移動する関数
function animation56() {
  const moving = document.getElementById('C');
  const target = document.getElementById('B');

  const from = moving.getBoundingClientRect();
  const to = target.getBoundingClientRect();

  const dx = to.left - from.left;
  const dy = to.top - from.top;

  const move = moving.animate([
    { transform: 'translate(0px, 0px)' },
    { transform: `translate(${dx}px, ${dy}px)` }
  ], {
    duration: 1100,
    easing: 'ease-in-out',
    fill: 'forwards'
  });

  move.onfinish = function() {
    completeTransfer56();
  };
}

function completeTransfer56() {
  flowers.B = [1,2,3,4,5];
  flowers.C = [];

  render();
  showResult();
}


// 4＋9用：花びら1枚を移動する関数
function animation() {
  const sourceSvg = document.getElementById('A');
  const targetSvg = document.getElementById('D');

  // Aの288°の花びら（番号4）
  const sourcePetal =
    sourceSvg.querySelector('[data-petal="4"]');

  if (!sourcePetal) {
    completeTransfer49();
    return;
  }

  // 移動元の画面上の位置
  const rect = sourcePetal.getBoundingClientRect();

  // Dの0°（番号5）の位置
  const targetPoint = targetSvg.createSVGPoint();
  targetPoint.x = 50;
  targetPoint.y = 27;

  const destination =
    targetPoint.matrixTransform(targetSvg.getScreenCTM());

  const scale =
    targetSvg.getBoundingClientRect().width / 100;

  const w = 17 * scale;
  const h = 29 * scale;

  const startX = rect.left + rect.width / 2 - w / 2;
  const startY = rect.top + rect.height / 2 - h / 2;

  const endX = destination.x - w / 2;
  const endY = destination.y - h / 2;

  // 移動する花びらの複製を作る
  const flying = document.createElement('div');

  flying.style.position = 'fixed';
  flying.style.left = `${startX}px`;
  flying.style.top = `${startY}px`;
  flying.style.width = `${w}px`;
  flying.style.height = `${h}px`;
  flying.style.borderRadius = '50%';
  flying.style.background = '#f5a5c2';
  flying.style.border = '1.5px solid #dc7a9f';
  flying.style.transform = 'rotate(288deg)';
  flying.style.transformOrigin = 'center';
  flying.style.pointerEvents = 'none';
  flying.style.zIndex = '9999';

  document.body.appendChild(flying);

  // 元の花びらは一時的に隠す
  sourcePetal.style.opacity = '0';

  const move = flying.animate([
    {
      left: `${startX}px`,
      top: `${startY}px`,
      transform: 'rotate(288deg)'
    },
    {
      left: `${endX}px`,
      top: `${endY}px`,
      transform: 'rotate(360deg)'
    }
  ], {
    duration: 1000,
    easing: 'ease-in-out',
    fill: 'forwards'
  });

  move.onfinish = function() {
    flying.remove();
    completeTransfer49();
  };
}
