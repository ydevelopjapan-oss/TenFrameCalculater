<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さくらの計算機</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 20px 12px;
  background: #fff7fb;
  color: #654b59;
  font-family: sans-serif;
  text-align: center;
}
h1 { color: #d878a0; font-size: 25px; }
.problem { font-size: 38px; font-weight: bold; margin: 20px; }
.garden {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 3px;
  max-width: 480px;
  margin: auto;
}
.flower { width: 100%; max-width: 100px; }
.name { font-weight: bold; }
.count { font-size: 13px; color: #b18b9e; }
svg { width: 100%; overflow: visible; }
.petal { fill: #f5a5c2; stroke: #dc7a9f; stroke-width: 1.5; }
.center { fill: #ffe08a; }
.controls { margin: 22px auto; }
input {
  width: 110px; height: 52px;
  border: 2px solid #efbfd2;
  border-radius: 14px;
  font-size: 25px; text-align: center;
}
button {
  border: 0; border-radius: 12px;
  background: #df86a9; color: white;
  font-size: 19px; font-weight: bold;
  padding: 12px 22px;
}
button:active { transform: scale(.96); }
.keys {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 8px; max-width: 260px; margin: 15px auto;
}
.keys button {
  background: white; color: #765466;
  border: 1px solid #efd3df;
}
#status { min-height: 45px; margin: 18px; }
#result {
  display: none; padding: 15px;
  background: #eff9ed; border-radius: 18px;
  max-width: 300px; margin: auto;
}
#tree {
  font-size: 90px;
  animation: appear .8s cubic-bezier(.2,1.5,.5,1);
}
@keyframes appear {
  from { transform: scale(.2); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.garden {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
  gap: 2px;
}

#tree {
  position: absolute;
  left: 12.5%;
  top: 0;
  width: 25%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: none;
  z-index: 5;
}

#tree svg {
  width: 100%;
  max-width: 110px;
}
</style>
</head>
<body>

<h1>🌸 さくらの計算機 🌸</h1>

<div class="problem">7 ＋ 4</div>

<div class="garden">
  <div class="flower">
    <svg id="B" viewBox="0 0 100 100"></svg>
  </div>
  <div class="flower">
    <svg id="A" viewBox="0 0 100 100"></svg>
  </div>
  <div class="flower">
    <svg id="C" viewBox="0 0 100 100"></svg>
  </div>
  <div class="flower">
    <svg id="D" viewBox="0 0 100 100"></svg>
  </div>
  <div id="tree"></div>
</div>

<div class="controls">
  <input id="answer" inputmode="numeric" placeholder="答え">
  <button id="equal">＝</button>
</div>

<div class="keys">
  <button onclick="key('1')">1</button>
  <button onclick="key('2')">2</button>
  <button onclick="key('3')">3</button>
  <button onclick="key('4')">4</button>
  <button onclick="key('5')">5</button>
  <button onclick="key('6')">6</button>
  <button onclick="key('7')">7</button>
  <button onclick="key('8')">8</button>
  <button onclick="key('9')">9</button>
  <button onclick="clearAnswer()">消</button>
  <button onclick="key('0')">0</button>
  <button onclick="backspace()">⌫</button>
</div>

<div id="status">答えを考えてみよう！</div>

<div id="result">
  <h2>7 ＋ 4 ＝ 11</h2>
  <p>2つの花が完成したよ！</p>
</div>

<script>
const angles = [72,144,216,288,0];

let flowers = {
  A:[1,2,3,4,5],
  B:[],
  C:[1,2,3,4],
  D:[1]
};

let finished = false;

function point(n) {
  const rad = angles[n-1] * Math.PI / 180;
  return [
    50 + Math.sin(rad)*23,
    50 - Math.cos(rad)*23
  ];
}

function draw(name) {
  const svg = document.getElementById(name);
  svg.innerHTML = '';

  flowers[name].forEach(n => {
    const [x,y] = point(n);
    const p = document.createElementNS(
      'http://www.w3.org/2000/svg','ellipse'
    );
    p.setAttribute('cx',x);
    p.setAttribute('cy',y);
    p.setAttribute('rx',8);
    p.setAttribute('ry',14);
    p.setAttribute('transform',
      `rotate(${angles[n-1]} ${x} ${y})`);
    p.setAttribute('class','petal');
    svg.appendChild(p);
  });

  if(flowers[name].length === 5) {
    const c = document.createElementNS(
      'http://www.w3.org/2000/svg','circle'
    );
    c.setAttribute('cx',50);
    c.setAttribute('cy',50);
    c.setAttribute('r',7);
    c.setAttribute('class','center');
    svg.appendChild(c);
  }
}

function render() {
  ['A','B','C','D'].forEach(draw);
}
render();

function key(n) {
  if(finished) return;
  const input = document.getElementById('answer');
  input.value = (input.value+n).slice(0,2);
}
function clearAnswer() {
  document.getElementById('answer').value='';
}
function backspace() {
  const input = document.getElementById('answer');
  input.value=input.value.slice(0,-1);
}

document.getElementById('equal').onclick = function() {
  if(finished) return;

  const answer = document.getElementById('answer').value;
  const status = document.getElementById('status');

  if(answer !== '') {
    if(Number(answer) === 11) {
      finished = true;
      status.textContent='正解！すごい！';
      showResult();
    } else {
      status.textContent='もう一度考えてみよう！';
    }
    return;
  }

  status.textContent='花びらが集まるよ…';
  this.disabled=true;

  setTimeout(animation,2000);
};

function animation() {
  const status = document.getElementById('status');

  // BにCの3枚を移動する
  // C1はそのまま残す
  const source = document.getElementById('C');
  const target = document.getElementById('B');

  const moving = [2,3,4];

  moving.forEach((slot,index) => {
    const [sx,sy] = point(slot);
    const [tx,ty] = point(3+index);

    const petal = [...source.querySelectorAll('.petal')]
      .find(p => Math.abs(
        Number(p.getAttribute('cx'))-sx
      ) < 0.1 && Math.abs(
        Number(p.getAttribute('cy'))-sy
      ) < 0.1);

    if(!petal) return;

    const from = source.getBoundingClientRect();
    const to = target.getBoundingClientRect();

    const dx = to.left + to.width*tx/100 -
               (from.left + from.width*sx/100);
    const dy = to.top + to.height*ty/100 -
               (from.top + from.height*sy/100);

    petal.animate([
      {transform:'translate(0,0) scale(1)'},
      {transform:`translate(${dx}px,${dy}px) scale(1.2)`},
      {transform:'translate(0,0) scale(1)'}
    ],{
      duration:1200,
      easing:'ease-in-out'
    });
  });

  setTimeout(() => {
    flowers.B=[1,2,3,4,5];
    flowers.C=[1];
    render();

    status.textContent='2つの花が完成！';
    finished=true;
    showResult();
  },1350);
}


function showResult() {
  const tree = document.getElementById('tree');

  // 木のイラストを挿入
  tree.innerHTML = `
    <svg viewBox="0 0 160 160">

      <!-- 幹 -->
      <path d="M75 145 Q68 105 78 65"
        stroke="#936b4d"
        stroke-width="16"
        fill="none"
        stroke-linecap="round"/>

      <!-- 腕・枝 -->
      <path d="M75 105 L35 72 M76 95 L120 65"
        stroke="#936b4d"
        stroke-width="9"
        fill="none"
        stroke-linecap="round"/>

      <!-- 頭の枝 -->
      <path d="M78 82 L78 48"
        stroke="#936b4d"
        stroke-width="7"
        fill="none"
        stroke-linecap="round"/>

      <!-- ギョロ目 -->
      <g>
        <path d="M78 49 Q65 35 55 47
          M78 49 Q92 35 103 47"
          stroke="#936b4d"
          stroke-width="5"
          fill="none"/>

        <ellipse cx="55" cy="45"
          rx="12" ry="15"
          fill="white"
          stroke="#594653"
          stroke-width="2"/>

        <ellipse cx="103" cy="45"
          rx="12" ry="15"
          fill="white"
          stroke="#594653"
          stroke-width="2"/>

        <circle cx="59" cy="49" r="5" fill="black"/>
        <circle cx="99" cy="49" r="5" fill="black"/>
      </g>

      <!-- 口 -->
      <path d="M68 115 Q78 125 88 115"
        stroke="#594653"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"/>

    </svg>
  `;

  // 木が中央にポンッと誕生
  const svg = tree.querySelector('svg');

  svg.animate([
    { transform: 'scale(0.1)', opacity: 0 },
    { transform: 'scale(1.15)', opacity: 1 },
    { transform: 'scale(1)', opacity: 1 }
  ], {
    duration: 800,
    easing: 'cubic-bezier(.2,1.5,.5,1)',
    fill: 'forwards'
  });

  document.getElementById('result').style.display = 'block';
  document.getElementById('equal').disabled = true;
}

</script>
</body>
</html>
